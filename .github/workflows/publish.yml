name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (the 0.0.0-stage placeholder reserves the name for this flow)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5 speaks the trusted-publisher OIDC flow natively
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm test
      - run: npm publish
